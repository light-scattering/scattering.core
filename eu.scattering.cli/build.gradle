plugins {
    id 'application'
    id 'com.gradleup.shadow' version '8.3.0'
}

application {
    mainClass = 'eu.scattering.cli.ScatterCLI'
}

shadowJar {
    archiveFileName.set("scatter-cli-${project.version}.jar")
}

dependencies {
    implementation project(':eu.scattering.core.design')
    implementation project(':eu.scattering.core.lib')

    implementation 'info.picocli:picocli:4.7.7'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    systemProperty "expected.app.version", rootProject.version

    dependsOn tasks.named('shadowJar')
}

// --- Diagnostics ---

def gitHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

def gitBranch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
}.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss")

processResources {
    inputs.property("projectVersion", project.version)
    inputs.property("gitBranch", gitBranch)
    inputs.property("buildTime", buildTime)
    inputs.property("gitHash", gitHash)

    filesMatching('**/version.properties') {
        expand(
                'projectVersion': project.version,
                'gitBranch': gitBranch,
                'gitCommit': gitHash,
                'buildTime': buildTime
        )
    }
}

// --- Wrapper / Python ---

tasks.register('pythonSetTemplate', Copy) {
    group = 'wrapper'
    description = 'Generates pyproject.toml with the current Gradle project version.'

    from project.file('wrapper/python/pyproject.template.toml')
    into project.file('wrapper/python/')

    rename 'pyproject.template.toml', 'pyproject.toml'

    expand(
        'projectVersion': project.version
    )
}

tasks.register('pythonSetJar', Sync) {
    group = 'wrapper'
    description = 'Syncs the shadow JAR to the Python wrapper, removing old versions.'

    dependsOn('shadowJar')

    from shadowJar.archiveFile
    into project.file('wrapper/python/src/scatter_cli/jars')
}

tasks.register('pythonPackageBuild', Exec) {
    group = 'wrapper'
    description = 'Builds the Python Scatter-CLI package.'
    workingDir = 'wrapper/python'

    dependsOn('pythonSetTemplate', 'pythonSetJar')

    commandLine 'python3', '-m', 'build'
}

tasks.register('pythonClean', Delete) {
    group = 'wrapper'
    description = 'Removes generated Python Scatter-CLI build artifacts.'

    delete 'wrapper/python/build'
    delete 'wrapper/python/dist'

    delete 'wrapper/python/src/scatter_cli.egg-info'

    delete 'wrapper/python/src/scatter_cli/jars'

    delete 'wrapper/python/pyproject.toml'
}

tasks.register('pythonPackageAdd', Exec) {
    group = 'wrapper'
    description = 'Installs the Python Scatter-CLI package.'
    workingDir = 'wrapper/python'

    dependsOn('pythonPackageBuild')

    commandLine 'python3', '-m', 'pip', 'install', '--force-reinstall', '.'
}

tasks.register('pythonPackageRemove', Exec) {
    group = 'wrapper'
    description = 'Uninstalls the Python Scatter-CLI package.'
    workingDir = 'wrapper/python'

    commandLine 'python3', '-m', 'pip', 'uninstall', '-y', 'scatter-cli'

    ignoreExitValue = true
}

// --- Wrapper / Node ---

tasks.register("nodeVerify", GradleBuild) {
    group = 'wrapper'
    description = 'Test the Node.js build.'

    tasks = ['nodeClean', 'nodePackageAdd', 'nodePackageTest', 'nodePackageRemove']
}

tasks.register('nodeSetTemplate', Copy) {
    group = 'wrapper'
    description = 'Generates package.json with the current Gradle project version.'

    from project.file('wrapper/node/package.template.json')
    into project.file('wrapper/node/')

    rename 'package.template.json', 'package.json'

    expand(
            'projectVersion': project.version
    )
}

tasks.register('nodeSetJar', Sync) {
    group = 'wrapper'
    description = 'Syncs the shadow JAR to the Node wrapper, removing old versions.'

    dependsOn('shadowJar')

    from shadowJar.archiveFile
    into project.file('wrapper/node/jars')
}

tasks.register('nodePackageBuild', Exec) {
    group = 'wrapper'
    description = 'Builds the Node.js Scatter-CLI package.'
    workingDir = 'wrapper/node'

    dependsOn('nodeSetTemplate', 'nodeSetJar')

    def dstDir = file('wrapper/node/dist')

    doFirst {
        dstDir.mkdirs()
    }

    def npmExe = System.getProperty("os.name").toLowerCase().contains("windows") ? 'npm.cmd' : 'npm'

    commandLine npmExe, 'pack', '--pack-destination', dstDir.absolutePath
}

tasks.register('nodeClean', Delete) {
    group = 'wrapper'
    description = 'Removes generated Node Scatter-CLI build artifacts.'

    delete 'wrapper/node/dist'
    delete 'wrapper/node/jars'
    delete 'wrapper/node/package.json'
}

tasks.register('nodePackageAdd', Exec) {
    group = 'wrapper'
    description = 'Installs the Node.js Scatter-CLI package.'
    workingDir = 'wrapper/node'

    dependsOn('nodePackageBuild')

    def dstDir = project.file('wrapper/node/dist')
    def tgzFile = new File(dstDir, "scatter-cli-${project.version}.tgz")

    def npmExe = System.getProperty("os.name").toLowerCase().contains("windows") ? 'npm.cmd' : 'npm'

    commandLine npmExe, 'install', '-g', tgzFile.absolutePath
}

tasks.register('nodePackageRemove', Exec) {
    group = 'wrapper'
    description = 'Uninstalls the Node.js Scatter-CLI package.'

    def npmExe = System.getProperty("os.name").toLowerCase().contains("windows") ? 'npm.cmd' : 'npm'

    commandLine npmExe, 'uninstall', '-g', 'scatter-cli'

    ignoreExitValue = true
}

tasks.register('nodePackageTest', Exec) {
    group = 'wrapper'
    description = 'Runs tests against the locally installed package.'

    def cli = System.getProperty("os.name").toLowerCase().contains("windows") ? "scatter-cli.cmd" : "scatter-cli"

    commandLine cli, '--version'

    def outputStream = new ByteArrayOutputStream()
    standardOutput = outputStream

    doLast {
        def vrActual = outputStream.toString().trim()
        def vrExpected = project.version.toString()

        if (!vrActual.contains(vrExpected)) {
            throw new GradleException("Version mismatch! Expected version '${vrExpected}' to be in output, but got: '${vrActual}'")
        }
    }
}

tasks.register('nodePackageTestPublished', Exec) {
    group = 'wrapper'
    description = 'Runs tests against the package from the NPM registry.'

    def npx = System.getProperty("os.name").toLowerCase().contains("windows") ? "npx.cmd" : "npx"

    commandLine npx, '--yes', "scatter-cli@${project.version}", '--version'
}

// --- Clean ---

tasks.named('clean') {
    delete 'out'

    dependsOn('pythonClean', 'pythonPackageRemove', 'nodeClean')
}