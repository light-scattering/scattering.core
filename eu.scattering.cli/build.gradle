plugins {
    id 'com.gradleup.shadow' version '8.3.0'
}

dependencies {
    implementation project(':eu.scattering.core.design')
    implementation project(':eu.scattering.core.lib')

    implementation 'info.picocli:picocli:4.7.7'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

jar {
    manifest {
        attributes 'Main-Class': 'eu.scattering.cli.Scattering'
    }
}

shadowJar {
    archiveFileName.set("scatt-cli-${project.version}.jar")
}

def gitHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

def gitBranch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
}.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss")

processResources {
    inputs.property("projectVersion", project.version)
    inputs.property("gitBranch", gitBranch)
    inputs.property("buildTime", buildTime)
    inputs.property("gitHash", gitHash)

    filesMatching('**/version.properties') {
        expand(
                'projectVersion': project.version,
                'gitBranch': gitBranch,
                'gitCommit': gitHash,
                'buildTime': buildTime
        )
    }
}

tasks.register('generatePythonToml', Copy) {
    group = 'build'
    description = 'Generates pyproject.toml with the current Gradle project version.'

    from rootProject.file('python/pyproject.template.toml')
    into rootProject.file('python/')

    rename 'pyproject.template.toml', 'pyproject.toml'

    expand(
        'projectVersion': project.version
    )
}

tasks.register('syncJarToPython', Sync) {
    group = 'build'
    description = 'Syncs the shadow JAR to the Python wrapper, removing old versions.'

    dependsOn shadowJar

    from shadowJar.archiveFile
    into rootProject.file('python/src/scatt_cli/jars')
}

tasks.named('shadowJar') {
    finalizedBy 'syncJarToPython', 'generatePythonToml'
}