
plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
test {
    useJUnitPlatform()
}

dependencies {
    implementation project(':eu.scattering.core.design')
    implementation project(':eu.scattering.core.lib')
    implementation("info.picocli:picocli:4.7.7")
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0-M1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.7.0-M1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.7.0-M1'
    testImplementation 'org.assertj:assertj-core:3.17.2'
}

jar {
    manifest {
        attributes 'Main-Class': 'eu.scattering.cli.Scat'
    }
}

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

def getGitBranch = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

processResources {
    filesMatching('**/version.properties') {
        expand(
                'gitBranch': getGitBranch(),
                'gitCommit': getGitHash(),
                'buildTime': new Date().format("yyyy-MM-dd HH:mm:ss")
        )
    }
}