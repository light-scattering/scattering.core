plugins {
    id 'base'
    id "com.vanniktech.maven.publish" version "0.37.0" apply false
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        modularity.inferModulePath = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption('Xdoclint:none', true)
    }

    repositories {
        mavenCentral()
    }

    pluginManager.withPlugin("com.vanniktech.maven.publish") {

        mavenPublishing {
            signAllPublications()

            pom {
                name = "scattering.core - ${project.name}"
                description = 'Open-source software for the generation and analysis of synthetic fractal aggregates.'
                inceptionYear = '2020'
                url = 'https://github.com/light-scattering/scattering.core'

                scm {
                    connection = 'scm:git:git://github.com/light-scattering/scattering.core.git'
                    developerConnection = 'scm:git:ssh://git@github.com/light-scattering/scattering.core.git'
                    url = 'https://github.com/light-scattering/scattering.core'
                }

                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/light-scattering/scattering.core/issues'
                }

                licenses {
                    license {
                        name = 'GNU Affero General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/agpl-3.0.html'
                    }
                }

                developers {
                    developer {
                        id = 'krzysztofskorupski'
                        name = 'Krzysztof Skorupski'
                        email = 'krzysztof.skorupski@scattering.eu'
                        url = 'https://orcid.org/0000-0002-4833-2819'
                    }
                }
            }
        }
    }
}