plugins {
    id 'base'
    id "com.vanniktech.maven.publish" version "0.37.0" apply false
}

// --- Subprojects ---

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        modularity.inferModulePath = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption('Xdoclint:none', true)
    }

    repositories {
        mavenCentral()
    }

    pluginManager.withPlugin("com.vanniktech.maven.publish") {

        mavenPublishing {
            signAllPublications()

            pom {
                name = "scattering.core - ${project.name}"
                description = 'Software for the generation and analysis of synthetic fractal aggregates.'
                inceptionYear = '2020'
                url = 'https://github.com/light-scattering/scattering.core'

                scm {
                    connection = 'scm:git:git://github.com/light-scattering/scattering.core.git'
                    developerConnection = 'scm:git:ssh://git@github.com/light-scattering/scattering.core.git'
                    url = 'https://github.com/light-scattering/scattering.core'
                }

                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/light-scattering/scattering.core/issues'
                }

                licenses {
                    license {
                        name = 'GNU Affero General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/agpl-3.0.html'
                    }
                }

                developers {
                    developer {
                        id = 'krzysztofskorupski'
                        name = 'Krzysztof Skorupski'
                        email = 'krzysztof.skorupski@scattering.eu'
                        url = 'https://orcid.org/0000-0002-4833-2819'
                    }
                }
            }
        }
    }
}

// --- Python wrapper ---

def pythonProjectDir = file("${rootDir}/python")
def pythonJarDir = file("${pythonProjectDir}/src/scatt_cli/jars")

tasks.register('buildPackage', Exec) {
    group = 'Python'
    description = 'Builds the Python scatt-cli package (generates wheel and sdist).'
    workingDir = pythonProjectDir

    doFirst {
        if (!pythonJarDir.exists() || pythonJarDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.isEmpty()) {
            throw new GradleException("Cannot build Python package: No JAR found in '${pythonJarDir}'.")
        }
    }

    commandLine 'python3', '-m', 'build'
}

tasks.register('installPackage', Exec) {
    group = 'Python'
    description = 'Installs the scatt-cli Python package locally for testing.'
    workingDir = pythonProjectDir

    dependsOn('buildPackage')

    commandLine 'python3', '-m', 'pip', 'install', '--force-reinstall', '.'
}

tasks.register('uninstallPackage', Exec) {
    group = 'Python'
    description = 'Uninstalls the scatt-cli Python package from the local environment.'
    workingDir = pythonProjectDir

    commandLine 'python3', '-m', 'pip', 'uninstall', '-y', 'scatt-cli'
}