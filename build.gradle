plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-context:5.2.8.RELEASE'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}


subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    group 'eu.scattering'
    version '1.0-SNAPSHOT'

    java {
        modularity.inferModulePath = true
    }

    repositories {
        mavenCentral()
    }
}

