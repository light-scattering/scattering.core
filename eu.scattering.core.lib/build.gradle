plugins {
    id "com.vanniktech.maven.publish"
}

test {
    useJUnitPlatform()

    systemProperty "expected.app.version", project.version
}

dependencies {
    implementation project(':eu.scattering.core.design')

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

    testImplementation 'org.assertj:assertj-core:3.27.7'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --- Diagnostics ---

def gitHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

def gitBranch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
}.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss")

processResources {
    inputs.property("projectVersion", project.version)
    inputs.property("gitBranch", gitBranch)
    inputs.property("buildTime", buildTime)
    inputs.property("gitHash", gitHash)

    filesMatching('**/version.properties') {
        expand(
                'projectVersion': project.version,
                'gitBranch': gitBranch,
                'gitCommit': gitHash,
                'buildTime': buildTime
        )
    }
}

// --- Repomix ---

tasks.register('repomix', Exec) {
    group = 'build'
    description = 'Runs Repomix to bundle the src/main/java directory into the build folder.'

    def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    def outputFile = layout.buildDirectory.file("repomix-output.xml").get().asFile.absolutePath

    if (isWindows) {
        executable = 'cmd'
        args = ['/c', 'npx', 'repomix', 'src/main/java', '--output', outputFile]
    } else {
        executable = 'npx'
        args = ['repomix', 'src/main/java', '--output', outputFile]
    }

    doFirst {
        layout.buildDirectory.get().asFile.mkdirs()
    }
}

// --- Clean ---

tasks.named('clean') {

    delete 'out'
}