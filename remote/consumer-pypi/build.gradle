def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

def systemCli = isWindows ? "scatter-cli.exe" : "scatter-cli"

def venvPython = isWindows ? "venv/Scripts/python.exe" : "venv/bin/python"
def venvCli = isWindows ? "venv/Scripts/scatter-cli.exe" : "venv/bin/scatter-cli"

def rootProperties = new Properties()
file('../../gradle.properties').withInputStream { rootProperties.load(it) }
def targetVersion = rootProperties.getProperty('version')

tasks.register('venvClean', Delete) {
    description = 'Deletes the testing virtual environment'
    group = 'build'

    delete "venv"
}

tasks.register('venvCreate', Exec) {
    description = 'Creates a cached, isolated Python virtual environment'
    group = 'build'

    outputs.dir("venv")

    commandLine 'python3', '-m', 'venv', 'venv'
}

tasks.register('installWithPyPI', Exec) {
    description = 'Installs the target version of Scatter-CLI from TestPyPI'
    group = 'build'

    dependsOn 'venvCreate'

    commandLine venvPython, '-m', 'pip', 'install',
            '--index-url', 'https://test.pypi.org/simple/',
            '--extra-index-url', 'https://pypi.org/simple',
            "scatter-cli==${targetVersion}"
}

// --- Repo test ---

tasks.register('testLocal', Exec) {
    description = 'Runs tests against the locally installed package'
    group = 'verification'

    commandLine systemCli, '--version'
}

tasks.register('testProd', Exec) {
    description = 'Runs tests pulling the package from TestPyPI'
    group = 'verification'

    dependsOn 'installWithPyPI'

    commandLine venvCli, '--version'
}